<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLA-C02 Study Guide — 30-Day Interactive Prep</title>
<meta name="description" content="Interactive 30-day study guide for the AWS Certified Machine Learning Engineer – Associate (MLA-C02) exam. Daily walkthroughs, labs, quizzes, and progress tracking.">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-badge">ML</span>
      <div>
        <div class="brand-title">MLA-C02 Study Guide</div>
        <div class="brand-sub">AWS Certified Machine Learning Engineer · Associate (beta) · 30 days</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="daysComplete">0 / 30 days</span><span id="tasksComplete" class="muted"></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle day navigation">Days</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav id="dayNav" aria-label="Study days"></nav>
    <div class="sidebar-foot">
      <button class="link-btn" id="resetProgress">Reset progress</button>
    </div>
  </aside>
  <main class="content" id="content" aria-live="polite"></main>
</div>

<footer class="foot">
  <span>Built for focused exam prep · Progress is saved in this browser only</span>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
