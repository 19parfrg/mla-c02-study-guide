<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ME1-C02 Study Quest — 26-Day Gamified Prep</title>
<meta name="description" content="Gamified 26-day study plan for the AWS Certified Machine Learning Engineer – Associate beta exam (ME1-C02, the updated MLA-C02). Daily quests, AWS missions, boss fights, spaced repetition, and progress tracking.">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandHome" aria-label="Go to headquarters">
      <span class="brand-badge">ML</span>
      <span>
        <span class="brand-title">ME1-C02 Study Quest</span>
        <span class="brand-sub">AWS Certified Machine Learning Engineer · Associate · beta of MLA-C02 · 26 days</span>
      </span>
    </button>
    <div class="hud">
      <span class="hud-chip" id="streakCount">🔥 0</span>
      <span class="hud-chip xp" id="xpTotal">0 XP</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="rankName">Lv 1</span><span id="tasksComplete" class="muted"></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-days" id="daysComplete">0 / 26 days</div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle day navigation">Days</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav id="dayNav" aria-label="Study days"></nav>
    <div class="sidebar-foot">
      <button class="link-btn" id="resetProgress">Reset progress</button>
    </div>
  </aside>
  <main class="content" id="content" aria-live="polite"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<footer class="foot">
  <span>Built for focused exam prep · Progress is saved in this browser only</span>
</footer>

<script src="data-1.js?v=5"></script>
<script src="data-2.js?v=5"></script>
<script src="data-3.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
